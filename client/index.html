<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procesos 26-27</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <main>
    <h1>Procesos 26-27</h1>
    <p class="subtitulo">Crea tu cuenta o inicia sesión.</p>
    <p id="aviso-global" class="mensaje" role="status"></p>

    <section id="zona-sesion" class="tarjeta" hidden>
      <h2>Sesión iniciada</h2>
      <p id="usuario-sesion"></p>
      <button id="boton-salir" type="button">Salir</button>
      <button id="boton-eliminar-cuenta" type="button">Eliminar mi cuenta</button>
    </section>

    <section id="zona-admin" class="tarjeta" hidden>
      <h2>Administración de usuarios</h2>
      <table id="tabla-usuarios">
        <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="aviso-admin" class="mensaje" role="status"></p>
    </section>

    <section id="zona-ranking" class="tarjeta">
      <h2>Ranking Elo</h2>
      <label>Deporte
        <select id="ranking-deporte">
          <option value="duatlon">Duatlón</option>
          <option value="triatlon">Triatlón</option>
        </select>
      </label>
      <label>Ver
        <select id="ranking-vista">
          <option value="atletas">Atletas</option>
          <option value="clubes">Clubes</option>
        </select>
      </label>
      <label>Sexo
        <select id="ranking-sexo">
          <option value="M">Masculino</option>
          <option value="F">Femenino</option>
          <option value="">Todos</option>
        </select>
      </label>
      <div class="tabla-desplazable">
        <table id="tabla-ranking">
          <thead><tr><th>#</th><th>Atleta</th><th>Club</th><th>Elo</th><th>Pruebas</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="paginador">
        <button id="ranking-anterior" type="button">← Anterior</button>
        <span id="ranking-pagina" class="suave"></span>
        <button id="ranking-siguiente" type="button">Siguiente →</button>
      </div>
      <button id="ranking-recalcular" type="button" hidden>Recalcular el ranking</button>
      <p id="aviso-ranking" class="mensaje" role="status"></p>
    </section>

    <section id="zona-resultados" class="tarjeta">
      <h2>Resultados</h2>
      <div id="vista-pruebas">
        <label>Deporte
          <select id="filtro-deporte">
            <option value="">Todos</option>
            <option value="duatlon">Duatlón</option>
            <option value="triatlon">Triatlón</option>
          </select>
        </label>
        <ul id="lista-pruebas" class="lista"></ul>
        <form id="form-buscar" class="buscador" novalidate>
          <label>Buscar atleta <input name="q" placeholder="Nombre o apellidos" autocomplete="off"></label>
          <button type="submit">Buscar</button>
        </form>
        <ul id="lista-atletas" class="lista"></ul>
      </div>
      <div id="vista-detalle" hidden></div>
      <p id="aviso-resultados" class="mensaje" role="status"></p>
    </section>

    <div class="formularios" id="zona-formularios">
      <section class="tarjeta">
        <h2>Registro</h2>
        <form id="form-registro" novalidate>
          <label>Nombre <input name="nombre" autocomplete="name" required></label>
          <label>Email <input name="email" type="email" autocomplete="email" required></label>
          <label>Contraseña (mínimo 8 caracteres) <input name="password" type="password" autocomplete="new-password" required></label>
          <button type="submit">Crear cuenta</button>
          <p class="mensaje" role="status"></p>
        </form>
      </section>

      <section class="tarjeta">
        <h2>Iniciar sesión</h2>
        <form id="form-login" novalidate>
          <label>Email <input name="email" type="email" autocomplete="email" required></label>
          <label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">Entrar</button>
          <p class="mensaje" role="status"></p>
        </form>
      </section>
    </div>

    <p id="estado">Comprobando el servidor...</p>
  </main>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
