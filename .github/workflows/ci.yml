name: CI

# Integración continua: ejecuta las pruebas en cada pull request y en cada cambio en main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    # MongoDB de servicio para las pruebas de contrato del repositorio real.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI_PRUEBA: mongodb://localhost:27017
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar las pruebas
        run: npm test
